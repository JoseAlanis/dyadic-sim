[project]
name = "dyadic-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.86.0",
    "matplotlib>=3.11.0",
    "openai>=2.29.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "reportlab>=4.5.1",
    "sentence-transformers>=5.3.0",
    "sentencepiece>=0.2.0",
    "sacremoses>=0.1.1",
    "torch",
    "torchvision",
    "transformers>=4.48.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8"]

[tool.ruff.lint]
# Beyond the defaults (E4/E7/E9/F): import order, simplifications, timezone-aware
# datetimes, pyupgrade, and bugbear. Line length is deliberately not enforced.
extend-select = ["I", "SIM", "DTZ", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "agents", "analysis", "memory", "priors", "simulation", "study_web", "symptom_scoring",
]

[tool.pytest.ini_options]
# The repository root must be importable for `analysis`, `simulation` etc.
# Without this, a bare `pytest` fails at collection and only `PYTHONPATH=. pytest`
# works, which is an undocumented requirement nobody should have to remember.
pythonpath = ["."]
testpaths = ["tests"]
