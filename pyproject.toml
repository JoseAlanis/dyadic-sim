[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dyadic-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.86.0",
    "matplotlib>=3.11.0",
    "openai>=2.29.0",
    "openpyxl>=3.1.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "reportlab>=4.5.1",
    "sentence-transformers>=5.3.0",
    "sentencepiece>=0.2.0",
    "sacremoses>=0.1.1",
    "torch",
    "torchvision",
    "transformers>=4.48.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
dyadic-sim = "dyadic_sim.cli:main"

[tool.hatch.build.targets.sdist]
include = ["dyadic_sim", "config", "tests", "README.md", "LICENSE", "CITATION.cff"]

# Bundled defaults: config/ (models, priors, *.example.yaml) ships inside the
# wheel; a user's <root>/config/ overrides it file by file. Files go through the
# normal selection, so anything .gitignore excludes (local designs and spec,
# generated cases) stays out whichever way the wheel is built.
[tool.hatch.build.targets.wheel]
only-include = ["dyadic_sim", "config"]

[tool.hatch.build.targets.wheel.sources]
"config" = "dyadic_sim/_defaults/config"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[tool.ruff.lint]
# Beyond the defaults (E4/E7/E9/F): import order, simplifications, timezone-aware
# datetimes, pyupgrade, and bugbear. Line length is deliberately not enforced.
extend-select = ["I", "SIM", "DTZ", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dyadic_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# The repository's own code: the top-level scripts and every package below the
# root, not the tests. Run with `uv run pytest --cov`.
source = ["."]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
sort = "Cover"
