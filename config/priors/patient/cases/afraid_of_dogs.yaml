# Patient case: afraid_of_dogs
# A specific phobia; orthogonal to the PHQ-9 depression domains (the hard bed).
# All fields are shown to the patient agent, first person. No symptoms block:
# run_symptom_experiments.py injects one per condition; as-is, this is the control.

presenting_complaint: >
  I'm terrified of dogs. It seems irrational, most of them are probably
  harmless. My friends have dogs and I feel embarrassed about being so
  afraid around them. I can't go to certain places because of it. I think
  it started after I was bitten as a child, and it just never went away.
  I'd like to not feel this way anymore.

theory_of_cure: >
  I've read a bit about exposure therapy. I think if I could get used to
  being around dogs gradually, it might get easier. They're probably not
  dangerous, I know that, but I'm still so afraid. I just need to learn to
  be less afraid of them.

relational_pattern: >
  I get on with people well enough. I can laugh at myself about this, it's
  easier than having people feel sorry for me. I usually assume people mean
  well.

transference_expectation: >
  I think you'll know what to do and help me do it. This feels like a
  practical problem that should have a practical solution.

resistance_structure: >
  When it comes to actually doing something about it, going near a dog or
  making a plan for the weekend, I find reasons to put it off.
