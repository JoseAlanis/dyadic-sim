# Patient case: no_complaint
# The null bed: no presenting concern, ordinary manageable demands, a small
# fixed background. All fields are shown to the patient agent, first person.
# No symptoms block: run_symptom_experiments.py injects one per condition and
# declares the batch's symptoms absent in the control, so the health facts are
# stated separately from the reason for attending.
# Since prompt variant 7b: compact, without the optional psychological
# sections (theory of cure, relational pattern, transference, resistance), and
# the rule against further problems belongs to this case alone.

presenting_complaint: >
  This is an introductory appointment my work offers, and I had one available.
  I didn't come because of a particular concern. Life has the usual demands and
  the odd minor frustration, and I'm managing my usual responsibilities and
  activities. Apart from the health facts below, I have no health or emotional
  problems.

everyday_context: >
  I'm 41 and work as an electrician for a local firm. I live with my partner,
  and I see a few old friends most months. In my spare time I do DIY at home,
  mostly on Saturdays.
