# Patient prior template. Copy to cases/<name>.yaml and fill in the fields in
# the patient's own voice: first person, concrete, no symptom vocabulary
# (tests/test_case_priors.py checks). Only presenting_complaint is required; the
# others are optional and left out of the prompt when absent, and a short
# `everyday_context` (who I am, work, people, interests) may be added. No
# symptoms block: run_symptom_experiments.py injects one per condition.

presenting_complaint: >
  [What the patient says they are there for.
   First-person voice. Raw, not clinical.]

theory_of_cure: >
  [What the patient believes would fix their problem.
   This is often wrong, and the gap between this and what
   therapy can offer is where the drama lives.]

relational_pattern: >
  [How I am with people, in my own words: who I let in, what I do when
   someone gets close or pulls away. Not an attachment classification.]

transference_expectation: >
  [What I expect you, the therapist, will eventually do or turn out to be.]

resistance_structure: >
  [What I notice myself doing when something gets close: explaining
   instead of feeling, agreeing too readily, going quiet, changing the subject.]
