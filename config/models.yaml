# Model registry and role assignments
# Change the `roles` section to swap models between sessions
# All other sections define what is available

providers:
# Only `ollama` is enabled, so `agent_factory` cannot resolve a cloud provider
# and every session runs on this machine. `dyadic_sim/generation/agents/local_agent.py` uses the
# `openai` Python client against Ollama's OpenAI-compatible endpoint on
# localhost:11434; that is a local call, not a call to OpenAI. Session metadata
# records the model of every run.
#
# To enable a cloud provider, uncomment its block and set its API key in `.env`
# (`run.py` loads it at start); `dyadic_sim/generation/agents/claude_agent.py` and
# `dyadic_sim/generation/agents/openai_agent.py` implement them. Two consequences besides cost: the
# simulated clinical material is sent off the machine and may be retained by the
# provider, and model identity has a large effect on the transcripts, so a
# corpus should not mix providers.
#  anthropic:
#    base_url: https://api.anthropic.com
#    models:
#      - claude-opus-5
#      - claude-sonnet-5
#      - claude-haiku-4-5
#
#  openai:
#    base_url: https://api.openai.com/v1
#    models:
#      - gpt-4o
#      - o1

  ollama:
    base_url: http://localhost:11434
    models:
      - llama3.1
      - mistral-nemo

# Active role assignments for a session
# These are the defaults; override at runtime with --therapist / --patient flags
roles:
  therapist: llama3.1
  patient: llama3.1

# Counterfactual / swap config
# Used with: uv run python run.py --swap
swap:
  therapist: llama3.1
  patient: mistral-nemo
