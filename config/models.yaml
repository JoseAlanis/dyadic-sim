# Model registry and role assignments
# Change the `roles` section to swap models between sessions
# All other sections define what is available

providers:
# Cloud providers are deliberately disabled. The pipeline is kept fully local so
# runs are reproducible and no transcript content leaves the machine.
#
# Only `ollama` is uncommented, so `agent_factory` can never resolve a cloud
# provider: every session to date (857 as of 2026-08-12) used llama3.1 or
# mistral-nemo, and session metadata records the model per run if you want to
# check. Note `agents/local_agent.py` uses the `openai` PYTHON CLIENT, but points
# it at Ollama's OpenAI-compatible endpoint on localhost:11434 — that is a local
# HTTP call, not a call to OpenAI.
#
# Uncommenting is enough to enable a cloud provider: `agents/claude_agent.py`
# and `agents/openai_agent.py` are implemented, and ANTHROPIC_API_KEY and
# OPENAI_API_KEY are both present in `.env`, which `run.py` loads via
# `load_dotenv()` at import. So the guard here is the only thing stopping it.
#
# Before uncommenting, note what changes besides cost: patient transcripts are
# simulated clinical material, and a cloud provider means that content is sent
# off-machine and may be retained by the provider. Mixing providers within one
# corpus also breaks comparability — model identity is already a large effect
# here (see VALIDATION.md finding 6 on narration style).
#
# Model IDs below refreshed 2026-08-10; see manuscript/INFRASTRUCTURE.md.
#  anthropic:
#    base_url: https://api.anthropic.com
#    models:
#      - claude-opus-5
#      - claude-sonnet-5
#      - claude-haiku-4-5
#
#  openai:
#    base_url: https://api.openai.com/v1
#    models:
#      - gpt-4o
#      - o1

  ollama:
    base_url: http://localhost:11434
    models:
      - llama3.1
      - mistral-nemo

# Active role assignments for a session
# These are the defaults; override at runtime with --therapist / --patient flags
roles:
  therapist: mistral-nemo
  patient: mistral-nemo

# Counterfactual / swap config
# Used with: uv run python run.py --swap
swap:
  therapist: llama3.1
  patient: mistral-nemo
